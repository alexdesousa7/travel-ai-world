# Los Angeles, California (Wikidata Q65), discovered and reviewed on 2026-09-26.
# Wikidata has no P150 districts. OSM has 32 level-10 Neighborhood Council areas,
# mostly in the San Fernando Valley, not a complete partition of the city's
# Wikivoyage travel districts. Only Los Feliz maps clearly to Northwest; the
# other boundaries remain unassigned rather than receiving misleading guides.

slug = "los-angeles"
name = "Los Angeles"
aliases = ["los angeles", "los ángeles"]
language = "en"
wikipedia_lang = "en"
# OpenStreetMap relation of the city (Wikidata P402): selects the area for the boundaries and the place queries.
osm_relation = 207359
# Only used when `osm_relation` is unset.
osm_area = "Los Angeles"
# The country the planner names on a trip, and its ISO 3166-1 alpha-2 code.
country = "United States"
country_code = "US"
district_admin_level = 10
centre = [34.0522, -118.2437]
timezone = "America/Los_Angeles"
districts = [
    "Downtown",
    "Eastside",
    "Hollywood",
    "Northwest",
    "South",
    "West",
    "Wilshire",
]

# From OSM relation 207359 (Nominatim), rounded outwards.
[bbox]
south = 33.65
west = -118.67
north = 34.34
east = -118.15

